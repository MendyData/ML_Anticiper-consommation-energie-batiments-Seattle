[project]
name = "p3-anticipez-conso"
version = "0.1.0"
description = "Prédiction de la consommation d'énergie des bâtiments non résidentiels de Seattle"
authors = [
    {name = "MendyData", email = "mendy.data@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy (>=2.1.0,<3.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "matplotlib (>=3.8.0,<4.0.0)",
    "seaborn (>=0.13.0,<1.0.0)",
    "scipy (>=1.11.0,<2.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "shap (>=0.46.0,<1.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.0"
jupyterlab = "^4.2"
nbconvert = "^7.16"
ipywidgets = "^8.1.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
